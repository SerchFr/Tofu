--- 
- name: Ensure borg group exists
  ansible.builtin.group:
    name: borg
    state: present

- name: Add ubuntu to borg group
  ansible.builtin.user:
    name: ubuntu
    groups: borg
    append: true

- name: Create folder with the borgbackup
  ansible.builtin.file:
    path: BorgBackup
    state: directory
    owner: root
    group: borg
    mode: "2775"        
    
- name: Configure Netplan routing
  ansible.builtin.template:
    src: 50-cloud-init.yaml.j2
    dest: /etc/netplan/50-cloud-init.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply netplan    
