<VirtualHost *:443>

    ServerName mail.alpesnet.local

    #DocumentRoot /var/www/html
    DocumentRoot /var/www/html/public_html

    #SSLEngine on

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    #ErrorLog ${APACHE_LOG_DIR}/roundcube-ssl-error.log
    #CustomLog ${APACHE_LOG_DIR}/roundcube-ssl-access.log combined
    SSLEngine on
    SSLCertificateFile /etc/ssl/roundcube/mail.crt
    SSLCertificateKeyFile /etc/ssl/roundcube/mail.key
    
</VirtualHost>
